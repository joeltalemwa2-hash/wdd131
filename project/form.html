<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Budget Tool</title>

<meta name="description" content="Submit your financial habits and track your budgeting habits.">
<meta name="author" content="Joel Talemwa">

<link rel="stylesheet" href="styles/styles.css">
<script src="scripts/main.js" defer></script>
</head>

<body>

<header>
  <h1>SmartMoney UG</h1>
  <button id="menu">☰</button>

  <nav id="nav">
    <a href="index.html">Home</a>
    <a href="tips.html">Tips</a>
    <a href="form.html">Budget Tool</a>
    <a href="references.html">References</a>
  </nav>
</header>

<main>
  <h2>Budget Review Form</h2>

  <form method="get" action="review.html">

    <label for="name">Your Name</label>
    <input type="text" id="name" name="name">

    <label for="income">Monthly Income *</label>
    <input type="number" id="income" name="income" required>

    <label for="expenses">Monthly Expenses *</label>
    <input type="number" id="expenses" name="expenses" required>

    <fieldset>
      <legend>Saving Habit *</legend>

      <input type="radio" id="good" name="saving" value="good" required>
      <label for="good">Good</label>

      <input type="radio" id="average" name="saving" value="average" required>
      <label for="average">Average</label>

      <input type="radio" id="poor" name="saving" value="poor" required>
      <label for="poor">Poor</label>
    </fieldset>

    <input type="submit" value="Submit">
  </form>
</main>

<footer>
  <p>© <span id="year"></span> Joel Talemwa</p>
  <p id="lastModified"></p>
</footer>

</body>
</html>
